name: Build Dolingo Android APK
on:
  push:
    branches:
      - dolingo-android-apk
      - feature/cvdict-offline-1-2-1
    paths:
      - 'dolingo_android/**'
      - '.github/workflows/build-dolingo-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17 for Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python3 -m pip install --user 'buildozer==1.5.0' 'cython==0.29.37' 'setuptools<76' 'Pillow>=9,<12'
      - name: Copy official HSK dataset into app
        run: |
          mkdir -p dolingo_android/data
          cp hsk30.csv dolingo_android/data/hsk30.csv
          test -s dolingo_android/data/hsk30.csv
      - name: Build complete offline CVDICT dictionary
        run: |
          python3 dolingo_android/build_cvdict.py
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect('dolingo_android/data/cvdict.sqlite3')
          n = db.execute('select count(*) from entries').fetchone()[0]
          assert n > 100000, n
          assert db.execute("select count(*) from entries where simplified='学习'").fetchone()[0] > 0
          print('CVDICT data ready:', n)
          PY
      - name: Generate and verify offline illustrations
        run: |
          python3 dolingo_android/build_illustrations.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          d = Path('dolingo_android/assets/illustrations')
          files = list(d.glob('*.png'))
          assert len(files) >= 24, len(files)
          assert (d / 'food.png').is_file()
          for file in files:
              with Image.open(file) as im:
                  im.verify()
          print('Illustrations validated:', len(files))
          PY
      - name: Check bundled data and app source before Android build
        run: |
          python3 -m py_compile dolingo_android/main.py dolingo_android/cvdict_search.py dolingo_android/build_cvdict.py dolingo_android/build_illustrations.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("dolingo_android/data")
          hsk = json.loads((base / "words_hsk30_real.json").read_text(encoding="utf-8"))
          eng = json.loads((base / "english_learner_thesaurus.json").read_text(encoding="utf-8"))
          vi = json.loads((base / "vi_hsk_cvdict.json").read_text(encoding="utf-8"))
          curated = json.loads((base / "vi_starter.json").read_text(encoding="utf-8"))
          assert len(hsk) == 11092, len(hsk)
          assert len(eng["entries"]) >= 2000, len(eng["entries"])
          assert all("word" in row and "level" in row for row in hsk)
          assert len(vi["entries"]) > 10000
          assert len(curated["hsk"]) > 300
          print("Data OK", len(hsk), len(eng["entries"]), len(vi["entries"]))
          PY
      - name: Build Android debug APK
        working-directory: dolingo_android
        env:
          ACCEPT_ANDROID_SDK_LICENSE: '1'
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$HOME/.local/bin:$PATH"
          java -version
          python3 -m py_compile main.py
          set +o pipefail
          yes y | buildozer -v android debug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolingo-HSK-Android-APK
          path: dolingo_android/bin/*.apk
          if-no-files-found: error
          retention-days: 30
